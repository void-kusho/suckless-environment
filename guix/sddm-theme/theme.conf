[General]
# Tokyo Night SDDM Theme — Minimal
# Matches the suckless environment color scheme

# Display server
DisplayServer=x11

# Theme name (directory containing this theme)
Theme=suckless-tokyonight

# Cursor theme
CursorTheme=Bibata-Modern-Classic

# Font
Font="Iosevka Nerd Font"

# Auto-login (disabled by default)
AutoLoginEnable=false

# Hide system users (show only uid >= 1000)
MinimumUid=1000

# Allow empty password
AllowEmptyPassword=false

# User avatar size (pixels)
MaximumImageSize=96
