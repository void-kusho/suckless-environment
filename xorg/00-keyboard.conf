# Persistent Brazilian ABNT2 keyboard layout.
#
# Read by the X server at device init, BEFORE any client (including fcitx5)
# starts, so it is the authoritative base layout. fcitx5 falls back to this
# whenever an input method (e.g. mozc) is deactivated, so the keyboard always
# returns to br/abnt2 instead of a stray default.
#
# `localectl` is unavailable on this setup (elogind/OpenRC), so the layout is
# written here directly rather than via `localectl set-x11-keymap`.
# Installed to /etc/X11/xorg.conf.d/00-keyboard.conf by install.sh.

Section "InputClass"
    Identifier "system-keyboard"
    MatchIsKeyboard "on"
    Option "XkbLayout" "br"
    Option "XkbModel" "abnt2"
    Option "XkbVariant" "abnt2"
EndSection
