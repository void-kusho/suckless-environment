# foot.ini — Tokyo Night, matching the X11 st configuration.
# Deployed to ~/.config/foot/foot.ini by home.scm.
#
# Font parity: origin/artix:st/config.h uses "Iosevka Nerd Font Mono:size=16".
# Guix has no Nerd-patched Iosevka, so the Nerd glyphs come from a fallback
# entry (font-nerd-symbols); foot walks this list in order per glyph.

[main]
font=Iosevka:size=16, Symbols Nerd Font Mono:size=16, Noto Sans CJK JP:size=16
pad=8x8
dpi-aware=no

# Use the default (shell-run) server mode so dwl's termcmd works with or
# without an explicit `foot --server`.
server=no

# ---- Colors: Tokyo Night (dark) ----
[colors]
alpha=1.0
# regular
foreground=c0caf5
background=1a1b26
# 0-7
regular0=414868
regular1=f7768e
regular2=9ece6a
regular3=e0af68
regular4=7aa2f7
regular5=bb9af7
regular6=7dcfff
regular7=a9b1d6
# 8-15
bright0=414868
bright1=ff7a93
bright2=b9f27c
bright3=ff9e64
bright4=7aa2f7
bright5=bb9af7
bright6=89ddff
bright7=c0caf5

# 16-255: foot supports full 16-256 via the `rgb:` form (not specified here);
# the ANSI palette above covers the terminal basics.

[csd]
preferred=server

[scrollback]
lines=10000

[key-bindings]
# Keep the dwl MODKEY+Return/Shift bindings intact; nothing to override.

[cursor]
style=block
blink=no

[selection]
clipboard=yes
