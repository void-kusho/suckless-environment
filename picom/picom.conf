# suckless-environment picom configuration.
#
# Goal: tear-free rendering (vsync) plus subtle window animations,
# nothing else -- no shadows, no transparency, no blur, no rounded
# corners, so the desktop looks and behaves exactly like bare dwm.
#
# Deployed by the NixOS module to /etc/xdg/picom/picom.conf; a user
# ~/.config/picom/picom.conf overrides it.

#################################
#           General             #
#################################

# GL backend is required for animations.
backend = "glx";

# Tear-free rendering: sync frames to the monitor's refresh.
vsync = true;

# Only repaint what changed (lower CPU/GPU usage).
use-damage = true;

# Get out of the way for fullscreen windows (videos, games): stop
# compositing while one is visible, resume afterwards.
unredir-if-possible = true;

#################################
#          Animations           #
#################################

# Window slides UP into place when opening...
animations = ({
  triggers = [ "open" ];
  preset = "slide-in";
  direction = "up";
  duration = 0.15;
}, {
  # ...and slides DOWN out of view when closing.
  triggers = [ "close" ];
  preset = "slide-out";
  direction = "down";
  duration = 0.12;
});

#################################
#    Explicitly off / neutral   #
#################################

shadow = false;
fading = false;
corner-radius = 0;
blur-background = false;
inactive-dim = 0.0;
